spring:
  application:
    name: roboparts
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
      mail.debug: false
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roboparts}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: roboparts
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: roboparts
    schemas: roboparts
    create-schemas: true
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    validate-migration-naming: true
    ignore-migration-patterns: []
server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:8h}
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  health:
    # Delivery is checked when issuing a code; general health must not contact Gmail.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
app:
  database:
    auto-migrate: ${DB_AUTO_MIGRATE:true}
  security:
    encryption-key: ${SECURITY_ENCRYPTION_KEY:}
    key-file: ${SECURITY_KEY_FILE:${user.home}/.roboparts/security.key}
    managers: ${SECURITY_MANAGERS:}
  email:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  registration:
    access-code: ${REGISTRATION_ACCESS_CODE:}
    require-invitation: ${REGISTRATION_REQUIRE_INVITATION:true}
  auth:
    account-limit:
      attempts: ${AUTH_ACCOUNT_MAX_ATTEMPTS:5}
      seconds: ${AUTH_ACCOUNT_WINDOW_SECONDS:900}
      capacity: ${AUTH_ACCOUNT_CAPACITY:4096}
    rate-limit:
      requests: ${AUTH_RATE_LIMIT_REQUESTS:20}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
      capacity: ${AUTH_RATE_LIMIT_CAPACITY:4096}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
logging:
  level:
    # Validation exceptions can include rejected password/code values at DEBUG.
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO
    org.hibernate.orm.jdbc.bind: OFF
